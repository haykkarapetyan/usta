<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Trip Itinerary — usta.am</title>
<meta name="description" content="Day-by-day trip itinerary: flights, stays, plans and packing list." />
<meta name="theme-color" content="#07090d" />
<meta name="robots" content="noindex" />

<meta property="og:title" content="Trip Itinerary" />
<meta property="og:description" content="Day-by-day plan: flights, stays, and what to bring." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://usta.am/trip/" />
<link rel="canonical" href="https://usta.am/trip/" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #07090d;
    --bg-soft: #0d1117;
    --bg-card: #10151d;
    --bg-card-2: #141b25;
    --border: #1c2430;
    --border-soft: #161d27;
    --text: #eaeef6;
    --text-muted: #99a3b3;
    --text-dim: #5f6b7c;
    --accent: #61dafb;
    --accent-2: #60a5fa;
    --accent-3: #c084fc;
    --accent-4: #fb7185;
    --radius: 16px;
    --radius-sm: 10px;
    --maxw: 1040px;
    --shadow: 0 20px 60px -20px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.65;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  h1,h2,h3,h4 { font-family: 'Sora','Inter',sans-serif; letter-spacing: -.02em; line-height: 1.15; margin: 0; }
  a { color: var(--accent); text-decoration: none; transition: color .18s ease; }
  a:hover { color: var(--accent-2); }
  code,.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  .container { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; position: relative; z-index: 2; }

  /* nav */
  nav { position: sticky; top: 0; z-index: 50; background: rgba(7,9,13,.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-soft); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 62px; gap: 16px; }
  .brand { font-family: 'Sora',sans-serif; font-weight: 700; color: var(--text); font-size: 15.5px; }
  .brand .dot { color: var(--accent); }
  .nav-links { display: flex; gap: 22px; align-items: center; }
  .nav-links a { color: var(--text-muted); font-size: 14.5px; font-weight: 500; }
  .nav-links a:hover { color: var(--text); }
  @media (max-width: 760px){ .nav-links a:not(.nav-cta){ display: none; } }

  /* hero */
  header.hero { padding: 72px 0 40px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-card); color: var(--text-muted); font-size: 12.5px; font-weight: 500; }
  .pill .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 800; margin: 18px 0 12px; }
  .lede { color: var(--text-muted); font-size: 17px; max-width: 62ch; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-top: 30px; }
  .meta { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
  .meta .k { color: var(--text-dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .meta .v { font-weight: 600; margin-top: 4px; font-size: 15px; }

  /* sections */
  section { padding: 44px 0; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 22px; }
  .sec-head h2 { font-size: clamp(22px,3.4vw,30px); font-weight: 700; }
  .sec-head .num { color: var(--accent); font-size: 13px; font-weight: 600; }

  /* timeline */
  .day { position: relative; padding: 0 0 6px 34px; border-left: 1px solid var(--border); }
  .day:last-child { border-left-color: transparent; }
  .day::before { content:''; position: absolute; left: -6px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(97,218,251,.12); }
  .day-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .day-head .date { color: var(--text-dim); font-size: 13px; font-weight: 600; }
  .day-head h3 { font-size: 19px; font-weight: 700; }
  .items { display: grid; gap: 10px; margin-bottom: 26px; }
  .item { display: grid; grid-template-columns: 68px 1fr; gap: 14px; background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 12px 14px; }
  .item .time { color: var(--accent-2); font-size: 13px; font-weight: 600; }
  .item .what { font-weight: 600; font-size: 15px; }
  .item .note { color: var(--text-muted); font-size: 13.5px; margin-top: 2px; }
  .item .note a { word-break: break-word; }
  @media (max-width: 560px){ .item { grid-template-columns: 1fr; gap: 4px; } }

  /* cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 14px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .card h4 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .card p { color: var(--text-muted); font-size: 14px; margin: 0; }
  .card .tag { display: inline-block; margin-bottom: 10px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-3); }

  /* checklist */
  .checklist { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 10px 26px; list-style: none; padding: 0; margin: 0; }
  .checklist li { display: flex; gap: 10px; align-items: flex-start; color: var(--text-muted); font-size: 14.5px; padding: 7px 0; border-bottom: 1px solid var(--border-soft); }
  .checklist input { accent-color: var(--accent); margin-top: 4px; width: 15px; height: 15px; flex: none; }
  .checklist label { cursor: pointer; }
  .checklist input:checked + label { color: var(--text-dim); text-decoration: line-through; }

  footer { padding: 36px 0 56px; text-align: center; color: var(--text-dim); font-size: 13.5px; border-top: 1px solid var(--border-soft); }

  @media print {
    nav, .noprint { display: none !important; }
    body { background: #fff; color: #000; }
    .item, .card, .meta { border-color: #ccc; background: #fff; }
    .lede, .card p, .checklist li, .item .note { color: #333; }
    section, header.hero { padding: 14px 0; page-break-inside: avoid; }
  }
</style>
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a class="brand" href="/">usta<span class="dot">.</span>am</a>
    <div class="nav-links">
      <a href="#itinerary">Itinerary</a>
      <a href="#logistics">Logistics</a>
      <a href="#packing">Packing</a>
      <a href="#" onclick="window.print();return false" class="nav-cta">Print</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <span class="pill"><span class="live"></span><span id="p-status">Planning</span></span>
    <h1 id="p-title">Trip Itinerary</h1>
    <p class="lede" id="p-lede">Day-by-day plan, stays, and everything worth having in one link.</p>
    <div class="meta-grid" id="p-meta"></div>
  </div>
</header>

<section id="itinerary">
  <div class="container">
    <div class="sec-head"><span class="num">01</span><h2>Itinerary</h2></div>
    <div id="p-days"></div>
  </div>
</section>

<section id="logistics">
  <div class="container">
    <div class="sec-head"><span class="num">02</span><h2>Logistics</h2></div>
    <div class="cards" id="p-logistics"></div>
  </div>
</section>

<section id="packing">
  <div class="container">
    <div class="sec-head"><span class="num">03</span><h2>Packing list</h2></div>
    <ul class="checklist" id="p-packing"></ul>
  </div>
</section>

<footer>
  <div class="container">
    <span id="p-footer"></span>
  </div>
</footer>

<!-- ==========================================================
     EDIT EVERYTHING BELOW. Nothing above needs to change.
     ========================================================== -->
<script>
const TRIP = {
  status: "Planning",
  title: "Trip Itinerary",
  lede: "Day-by-day plan, stays, and everything worth having in one link. Replace this text with your trip in one sentence.",

  // Small facts shown as cards under the title.
  meta: [
    { k: "Destination", v: "TBD" },
    { k: "Dates",       v: "TBD" },
    { k: "Travellers",  v: "TBD" },
    { k: "Base",        v: "TBD" }
  ],

  // The day-by-day plan. Add or remove days freely.
  days: [
    {
      date: "Day 1",
      title: "Arrival",
      items: [
        { time: "09:00", what: "Flight out",      note: "Airline / flight no. / terminal — add booking reference here." },
        { time: "14:00", what: "Check in",        note: "Hotel name and address. <a href='https://maps.google.com'>Open in Maps</a>" },
        { time: "19:00", what: "Dinner",          note: "Somewhere nearby, nothing booked." }
      ]
    },
    {
      date: "Day 2",
      title: "First full day",
      items: [
        { time: "10:00", what: "Main sight",      note: "Tickets: booked / to buy on the door." },
        { time: "15:00", what: "Free afternoon",  note: "Walk, coffee, whatever." }
      ]
    },
    {
      date: "Day 3",
      title: "Departure",
      items: [
        { time: "11:00", what: "Check out",       note: "Leave bags at reception if the flight is late." },
        { time: "16:00", what: "Flight home",     note: "Be at the airport 2h before." }
      ]
    }
  ],

  // Anything that isn't time-bound: stays, transport, money, contacts.
  logistics: [
    { tag: "Stay",      title: "Accommodation", body: "Name, address, check-in/out times, booking reference." },
    { tag: "Transport", title: "Getting around", body: "Airport transfer, metro card, car rental, driving notes." },
    { tag: "Money",     title: "Budget", body: "Currency, rough per-person cost, who paid what." },
    { tag: "Contacts",  title: "Numbers to have", body: "Hotel phone, local emergency number, embassy if relevant." }
  ],

  // Ticks are remembered in the browser of whoever opens the page.
  packing: [
    "Passport / ID",
    "Boarding passes",
    "Travel insurance",
    "Cards + some cash",
    "Phone charger",
    "Power adapter",
    "Meds",
    "Weather-appropriate layers"
  ],

  footer: "Made for the trip · <a href='/'>usta.am</a>"
};
</script>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[<>]/g, (c) => (c === "<" ? "&lt;" : "&gt;"));

  $("p-status").textContent = TRIP.status;
  $("p-title").textContent = TRIP.title;
  $("p-lede").innerHTML = TRIP.lede;
  document.title = TRIP.title + " — usta.am";

  $("p-meta").innerHTML = TRIP.meta
    .map((m) => `<div class="meta"><div class="k">${esc(m.k)}</div><div class="v">${m.v}</div></div>`)
    .join("");

  $("p-days").innerHTML = TRIP.days
    .map(
      (d) => `<div class="day">
        <div class="day-head"><span class="date">${esc(d.date)}</span><h3>${esc(d.title)}</h3></div>
        <div class="items">${d.items
          .map(
            (i) => `<div class="item">
              <div class="time">${esc(i.time || "")}</div>
              <div><div class="what">${esc(i.what)}</div>${i.note ? `<div class="note">${i.note}</div>` : ""}</div>
            </div>`
          )
          .join("")}</div>
      </div>`
    )
    .join("");

  $("p-logistics").innerHTML = TRIP.logistics
    .map(
      (c) => `<div class="card"><span class="tag">${esc(c.tag)}</span><h4>${esc(c.title)}</h4><p>${c.body}</p></div>`
    )
    .join("");

  // Packing list with per-browser persistence.
  const KEY = "usta-trip-packing";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}

  $("p-packing").innerHTML = TRIP.packing
    .map((item, n) => {
      const id = "pk" + n;
      return `<li><input type="checkbox" id="${id}" data-item="${esc(item)}"${saved[item] ? " checked" : ""} /><label for="${id}">${esc(item)}</label></li>`;
    })
    .join("");

  $("p-packing").addEventListener("change", (e) => {
    if (e.target.type !== "checkbox") return;
    saved[e.target.dataset.item] = e.target.checked;
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (err) {}
  });

  $("p-footer").innerHTML = TRIP.footer;
})();
</script>
</body>
</html>
